version: 0.2

env:
  variables:
    SERVICE_DIR: "blacklist-microservice"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Preparing container build environment"
      - test -n "$AWS_DEFAULT_REGION"
      - test -n "$AWS_ACCOUNT_ID"
      - test -n "$IMAGE_REPO_NAME"
      - test -n "$ECS_CONTAINER_NAME"
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR"
      - ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:=latest}"
      - IMAGE_URI="$ECR_REGISTRY/$IMAGE_REPO_NAME:$IMAGE_TAG"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  build:
    commands:
      - echo "Building container image $IMAGE_URI"
      - docker build -t "$IMAGE_REPO_NAME" "$SERVICE_DIR"
      - docker tag "$IMAGE_REPO_NAME:latest" "$IMAGE_URI"
  post_build:
    commands:
      - 'echo "Container image pushed: $IMAGE_URI"'
      - docker push "$IMAGE_URI"
      - printf '[{"name":"%s","imageUri":"%s"}]' "$ECS_CONTAINER_NAME" "$IMAGE_URI" > imagedefinitions.json
      - ls -lh imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
  discard-paths: no
