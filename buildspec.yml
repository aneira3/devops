version: 0.2

env:
  variables:
    SERVICE_DIR: "blacklist-microservice"
    ARTIFACT_DIR: "artifacts"
    ARTIFACT_NAME: "blacklist-microservice.tar.gz"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing Python dependencies"
      - cd "$SERVICE_DIR"
      - pip install --upgrade pip
      - pip install -r requirements.txt
  pre_build:
    commands:
      - echo "Running unit tests"
      - pytest --cov=app --cov-report=term-missing -q
  build:
    commands:
      - echo "Preparing deployable artifact"
      - cd "$CODEBUILD_SRC_DIR"
      - rm -rf "$ARTIFACT_DIR"
      - mkdir -p "$ARTIFACT_DIR"
      - tar --exclude='.pytest_cache' --exclude='__pycache__' --exclude='.coverage' --exclude='*.pyc' -czf "$ARTIFACT_DIR/$ARTIFACT_NAME" -C "$SERVICE_DIR" .
  post_build:
    commands:
      - echo "Build completed on $(date)"
      - ls -lh "$ARTIFACT_DIR"

artifacts:
  files:
    - artifacts/*
  discard-paths: no
